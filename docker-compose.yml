services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: role_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d role_management']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/role_management
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: http://localhost:8080
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3000/api
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  db-data:
